<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Penny · Catat Keuangan, Anggaran &amp; Tabungan</title>
    <meta name="description" content="Penny bantu kamu catat pemasukan, pengeluaran, anggaran, tabungan, dan investasi. Gratis, tanpa daftar, dan datanya tersimpan di HP kamu sendiri." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://mypenny.id/" />

    <!-- Theme before anything paints, so dark mode never flashes light. -->
    <script>
      (function(){try{var t=localStorage.getItem('penny-theme');if(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(e){}})();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- The build trims this to the icons the app uses (subsetIconFont in vite.config.js). -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1412" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Penny" />
    <meta name="application-name" content="Penny" />

    <!-- Link previews (WhatsApp, X, Facebook, LinkedIn, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Penny" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://mypenny.id/" />
    <meta property="og:title" content="Penny · Catat Keuangan, Anggaran &amp; Tabungan" />
    <meta property="og:description" content="Catat pemasukan, pengeluaran, anggaran, dan tabungan. Gratis, tanpa daftar, datanya tetap di HP kamu." />
    <meta property="og:image" content="https://mypenny.id/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo Penny dan tulisan: Catat pemasukan, pengeluaran, anggaran dan tabungan." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Penny · Catat Keuangan, Anggaran &amp; Tabungan" />
    <meta name="twitter:description" content="Catat pemasukan, pengeluaran, anggaran, dan tabungan. Gratis, tanpa daftar, datanya tetap di HP kamu." />
    <meta name="twitter:image" content="https://mypenny.id/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Penny",
        "url": "https://mypenny.id/",
        "image": "https://mypenny.id/og-image.png",
        "description": "Aplikasi pencatat keuangan pribadi: pemasukan, pengeluaran, anggaran per periode gajian, tabungan, investasi, dan patungan. Data tersimpan di perangkat, dengan backup opsional ke Google Drive.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web, Android, iOS",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": ["id", "en"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" },
        "featureList": [
          "Catat pemasukan dan pengeluaran",
          "Anggaran per periode gajian",
          "Jatah belanja harian",
          "Tabungan dan investasi",
          "Laporan dan analitik",
          "Tanya AI soal keuangan kamu",
          "Patungan dan scan struk",
          "Backup ke Google Drive"
        ]
      }
    </script>
  </head>
  <body>
    <!--
      Shown until the app mounts and replaces it: the first paint is the
      brand instead of a blank screen, and crawlers and link previews get a
      line of real text. Inline styles with fallbacks, since in dev the CSS
      arrives with the JavaScript.
    -->
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:var(--background,#f7f8fa);color:var(--muted-foreground,#6b7280);font-family:Manrope,system-ui,-apple-system,sans-serif">
        <img src="/favicon.svg?v=2" width="48" height="48" alt="" />
        <h1 style="margin:6px 0 0;font-size:18px;font-weight:800;letter-spacing:-0.02em;color:var(--foreground,#111827)">Penny</h1>
        <p style="margin:0;max-width:300px;font-size:13px;line-height:1.5">Catat pemasukan, pengeluaran, anggaran, dan tabungan. Gratis, datanya tetap di HP kamu.</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
